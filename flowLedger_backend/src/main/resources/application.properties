# ==========================================
# FlowLedger Application
# ==========================================

spring.application.name=flowLedger_backend
server.port=8082
# Disable the Spring Boot startup banner and logging for cleaner output.
spring.main.banner-mode=off
logging.level.root=OFF

app.security.jwt.secret=1ANlCVOFcaMNd1gp9SA1bgenc7BSgGEabEDN8sWq7SI=

#to debug spring security issues, set the logging level to TRACE
logging.level.org.springframework.security=TRACE
# logging.level.org.flywaydb=DEBUG
# logging.level.org.springframework.boot.autoconfigure.flyway=DEBUG
# ==========================================
# PostgreSQL Database Connection
# ==========================================
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5435/flowledger}
spring.datasource.username=flowledger
spring.datasource.password=flowledger
spring.datasource.driver-class-name=org.postgresql.Driver

# Connection pool (HikariCP)
spring.datasource.hikari.pool-name=FlowLedgerPool
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=2
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.idle-timeout=600000
spring.datasource.hikari.max-lifetime=1800000


# ==========================================
# JPA / Hibernate
# ==========================================
# Flyway manages database schema changes.
# Hibernate checks that entities match the schema.
spring.jpa.hibernate.ddl-auto=validate

# Avoid keeping database sessions open through web rendering.
spring.jpa.open-in-view=false

# Keep SQL logging disabled by default.
spring.jpa.show-sql=false

# Use PostgreSQL dialect detection by Hibernate.
# Explicit dialect configuration is usually unnecessary.


# ==========================================
# Flyway Database Migrations
# ==========================================
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration


# ==========================================
# Actuator / Application Monitoring
# ==========================================
management.endpoints.web.exposure.include=health,info,metrics
management.endpoint.health.probes.enabled=true

# Show health details only when authorized or appropriately secured.
management.endpoint.health.show-details=never

# Optional application information
management.info.env.enabled=true
info.app.name=FlowLedger
info.app.description=FlowLedger backend API
info.app.version=0.0.1


# ==========================================
# Logging
# ==========================================
logging.level.root=INFO
logging.level.org.springframework=WARN
logging.level.org.hibernate=WARN

# Replace with your actual Java base package if different.
# Example: logging.level.com.example.flowledger=DEBUG

# Log to a file as well as the console.
logging.file.name=logs/flowledger.log

# Log file rotation
logging.logback.rollingpolicy.max-file-size=10MB
logging.logback.rollingpolicy.max-history=14
logging.logback.rollingpolicy.total-size-cap=200MB
